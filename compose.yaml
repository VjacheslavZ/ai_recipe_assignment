# docker compose up --build  →  http://localhost:3001
services:
  recipe:
    build: .
    ports:
      - "3001:3001"
    env_file:
      # AI_PROVIDER, OPENAI_API_KEY, model settings. Without .env the image defaults apply
      # (AI_PROVIDER=openai), so set AI_PROVIDER=mock to try it without a key.
      - path: .env
        required: false
    environment:
      # Paths and host are fixed inside the container; they override values from .env.
      # A separate database file: the DB stores absolute run paths, which differ from a local `pnpm dev:server`.
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_PATH: /app/data/recipe.docker.db
      RUNS_DIR: /app/runs
      BRAND_KIT_DIR: /app/brand_kit
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./brand_kit:/app/brand_kit:ro
      - ./brief.example.yaml:/app/brief.example.yaml:ro
    restart: unless-stopped
